plugins {
    id 'com.android.application'
}

android {
    namespace = 'harishbhagat.shapeship'
    compileSdk = 36

    defaultConfig {
        applicationId = 'harishbhagat.shapeship'
        // 21 is the first release with native vector drawable support (step 3).
        minSdk = 21
        targetSdk = 36
        versionCode = 1
        versionName = '1.0'

        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        // Records the problems the 2016 code already had, so that only new ones fail the build.
        // The sw-only drawables (MissingDefaultResource) go in step 3.
        baseline = file('lint-baseline.xml')
    }
}

dependencies {
    // 1.8 needs minSdk 23. Step 3 removes AppCompat.
    implementation 'androidx.appcompat:appcompat:1.7.1'
    // appcompat pulls in two Kotlin standard library versions; the BOM aligns them.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
