plugins {
    id 'com.android.application'
}

android {
    namespace = 'harishbhagat.shapeship'
    compileSdk = 36

    defaultConfig {
        applicationId = 'harishbhagat.shapeship'
        // 21 is the first release with native vector drawable support (step 3).
        minSdk = 21
        targetSdk = 36
        versionCode = 1
        versionName = '1.0'

        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        // Records the problems the 2016 code already had, so that only new ones fail the build.
        baseline = file('lint-baseline.xml')
    }
}

dependencies {
    // ComponentActivity and EdgeToEdge, which keep content clear of the system bars on Android 15
    // and later. The activities don't need AppCompat: the app has no action bar or support widgets.
    // 1.12 needs minSdk 23.
    implementation 'androidx.activity:activity:1.11.0'
    // ResourcesCompat.getFont, which loads the fonts in res/font on Android 5 to 7.
    // The same version the activity library already brings in.
    implementation 'androidx.core:core:1.13.0'
    // The activity library pulls in two Kotlin standard library versions; the BOM aligns them.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
}
